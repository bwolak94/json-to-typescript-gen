openapi: "3.0.0"
info:
  title: Petstore
  version: "1.0.0"
  description: A minimal Petstore API used to demonstrate qms OpenAPI import

paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              example:
                - id: 1
                  name: Fluffy
                  tag: cat
                - id: 2
                  name: Rex
                  tag: dog
        "500":
          description: Unexpected error
          content:
            application/json:
              example:
                error: Internal server error

    post:
      summary: Create a pet
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                tag:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              example:
                id: 3
                name: Whiskers
                tag: cat
        "422":
          description: Validation error
          content:
            application/json:
              example:
                error: name is required

  /pets/{petId}:
    get:
      summary: Get a pet by ID
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A single pet
          content:
            application/json:
              example:
                id: 1
                name: Fluffy
                tag: cat
        "404":
          description: Pet not found
          content:
            application/json:
              example:
                error: pet not found

    delete:
      summary: Delete a pet
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Pet not found
          content:
            application/json:
              example:
                error: pet not found
